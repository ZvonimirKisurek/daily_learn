# MANAGEMENT track source catalogue (team lead -> C-level). Same fields as sources.yaml; every entry belongs to
# track "management" (file-level key below), so it feeds the management lessons, feed and skill graph only.
#
# What is in here: business schools and consultancies, business/startup news, practitioner blogs, leaders' own sites,
# newsletters, podcasts and YouTube channels (titles + descriptions), and topic feeds from Stack Exchange, Hacker News,
# DEV and Medium for the acronyms and themes of the path (OKR, SLA, P&L, hiring, strategy, governance...).
#
# HONEST STATUS: this list was assembled from knowledge of where these publishers keep their feeds and could NOT be
# tested from the environment it was written in. Some URLs will have moved or need a different path. Check them on
# your server (no database, no AI calls):
#     python -m app.cli ingest --dry-run --track management
# It prints OK / FAIL per source. A feed that keeps failing is skipped automatically after BREAKER_FAILURES attempts
# (circuit breaker), so a dead link costs nothing; fix or delete the FAIL lines when you have a minute.
track: management
