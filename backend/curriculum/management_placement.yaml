# Management placement exam: 3 questions per tier (job level), easiest first. Same rules as placement.yaml:
# a tier is KNOWN with at least `tier_pass` right; you start at the first level of the first tier you do not know.
tier_pass: 2
questions:
  # Tier 1: Team Lead
  - tier: 1
    question: "You have just become a team lead. What is the best single measure of how well YOU are doing?"
    options:
      - "How many tasks you personally complete each week"
      - "What your team as a whole delivers"
      - "How many hours you work"
      - "How many meetings you attend"
    answer: 1
    explanation: "A manager's output is the output of the team. Doing the most individual work is the classic new-manager trap."
  - tier: 1
    question: "What does SLA stand for, and what is it?"
    options:
      - "Service Level Agreement: a commitment to a customer about how good or fast a service will be"
      - "Senior Leadership Assessment: a yearly review of executives"
      - "Sales Lead Allocation: how leads are split between salespeople"
      - "Standard Legal Addendum: an extra page in every contract"
    answer: 0
    explanation: "An SLA is a promise with a number in it, such as 99.9% uptime or a reply within 4 hours, often with a penalty if it is missed."
  - tier: 1
    question: "In an OKR, what is the difference between the Objective and the Key Results?"
    options:
      - "The objective is the budget; key results are the costs"
      - "The objective is a qualitative goal; key results are measurable outcomes that show it was reached"
      - "The objective is for managers; key results are for engineers"
      - "There is no difference; they are two names for a task list"
    answer: 1
    explanation: "Objective: where we want to go, in words. Key results: the numbers that prove we got there."
  # Tier 2: Manager
  - tier: 2
    question: "Why do structured interviews (same questions, a scorecard) beat unstructured chats when hiring?"
    options:
      - "They are shorter"
      - "They make candidates more nervous, which reveals character"
      - "They let you compare candidates on the same criteria and reduce bias"
      - "They remove the need for reference checks"
    answer: 2
    explanation: "Consistency makes answers comparable and limits the 'I just liked them' effect."
  - tier: 2
    question: "On a project plan, what is the critical path?"
    options:
      - "The list of the riskiest tasks"
      - "The longest chain of dependent tasks, which sets the earliest possible finish date"
      - "The tasks the sponsor cares about most"
      - "The tasks done by the most senior people"
    answer: 1
    explanation: "Any delay on the critical path delays the whole project; tasks off it have slack."
  - tier: 2
    question: "A support team is measured only on 'tickets closed per day', and quality drops. Which idea explains this?"
    options:
      - "Parkinson's law"
      - "Goodhart's law: when a measure becomes a target, it stops being a good measure"
      - "The Pareto principle"
      - "Conway's law"
    answer: 1
    explanation: "People optimise the number, not the goal behind it. Pair a speed metric with a quality metric."
  # Tier 3: Senior Manager
  - tier: 3
    question: "A company reports a profit this quarter but is running out of cash. What is the most likely explanation?"
    options:
      - "That cannot happen: profit and cash are the same thing"
      - "Revenue was booked but customers have not paid yet, or cash went into stock and equipment"
      - "The company pays too little tax"
      - "The company's share price fell"
    answer: 1
    explanation: "Profit is an accounting result; cash depends on timing. Unpaid invoices, inventory and investments all consume cash."
  - tier: 3
    question: "It costs $300 to acquire a customer who brings $25 of gross margin per month. What is the CAC payback period?"
    options: ["3 months", "8 months", "12 months", "25 months"]
    answer: 2
    explanation: "Payback = CAC / monthly gross margin per customer = 300 / 25 = 12 months."
  - tier: 3
    question: "What is the purpose of a blameless postmortem after an incident?"
    options:
      - "To decide who should be disciplined"
      - "To find the system and process causes so it does not happen again, without punishing individuals"
      - "To prove to the customer that it was not your fault"
      - "To record the incident for the insurance company"
    answer: 1
    explanation: "If people fear blame they hide facts, and the same failure returns."
  # Tier 4: Director
  - tier: 4
    question: "Which of these is a strategy rather than a goal or a plan?"
    options:
      - "Grow revenue 30% next year"
      - "Ship the new mobile app in Q3"
      - "Win mid-size clinics, which big vendors ignore, with a product they can set up without IT, and say no to enterprise deals"
      - "Be the best company in our industry"
    answer: 2
    explanation: "Strategy names a specific challenge, a choice about where to play and how to win, and what you will not do. The others are targets or tasks."
  - tier: 4
    question: "In a negotiation, what is your BATNA?"
    options:
      - "Your opening offer"
      - "The best outcome you can get if this negotiation fails"
      - "The lowest price you would accept"
      - "The other side's budget"
    answer: 1
    explanation: "Best Alternative To a Negotiated Agreement: the stronger your alternative, the stronger your position."
  - tier: 4
    question: "Conway's law says that..."
    options:
      - "work expands to fill the time available"
      - "a system's design ends up mirroring the communication structure of the organisation that builds it"
      - "80% of results come from 20% of the effort"
      - "adding people to a late project makes it later"
    answer: 1
    explanation: "This is why changing the org chart is often the real way to change the architecture."
  # Tier 5: Vice President
  - tier: 5
    question: "A project earns a 9% return on invested capital. The company's cost of capital is 12%. Should it invest?"
    options:
      - "Yes: any positive return creates value"
      - "No: a return below the cost of capital destroys value"
      - "Yes, if the project is strategic, the numbers do not matter"
      - "It depends only on the payback period"
    answer: 1
    explanation: "Value is created only when ROIC exceeds the cost of the money used. 9% vs 12% loses value on every dollar invested."
  - tier: 5
    question: "Your sales team has a quarterly target of $1M and historically wins 25% of its pipeline. Roughly how much pipeline does it need?"
    options: ["$1M", "$2.5M", "$4M", "$25M"]
    answer: 2
    explanation: "Pipeline needed = target / win rate = 1M / 0.25 = 4M, i.e. 4x coverage."
  - tier: 5
    question: "When you join the executive team as a VP, which group should you treat as your 'first team'?"
    options:
      - "The department you run"
      - "Your peers on the executive team"
      - "Your direct reports' teams"
      - "The board of directors"
    answer: 1
    explanation: "Executives who optimise for their own function create silos. The company is run by the leadership team acting as one."
  # Tier 6: C-Level
  - tier: 6
    question: "What is the primary duty of a company's board of directors?"
    options:
      - "Running day-to-day operations"
      - "Acting in the interest of the company and its shareholders: overseeing strategy and risk, and hiring or firing the CEO"
      - "Approving every hire above manager level"
      - "Managing the marketing budget"
    answer: 1
    explanation: "Boards govern; management manages. The board's fiduciary duties are care and loyalty to the company."
  - tier: 6
    question: "Which job can a CEO least afford to delegate?"
    options:
      - "Choosing the office location"
      - "Setting the company's direction, deciding where capital goes and choosing the senior team"
      - "Writing the weekly status report"
      - "Running the daily sales stand-up"
    answer: 1
    explanation: "Direction, capital allocation and the top team are the levers only the CEO holds for the whole company."
  - tier: 6
    question: "Your company wants an AI capability that is not a source of competitive advantage and that several vendors sell well. What is the usual right call?"
    options:
      - "Build it in-house to keep control"
      - "Buy it, and save engineering effort for what differentiates you"
      - "Wait five years until the technology is mature"
      - "Acquire one of the vendors"
    answer: 1
    explanation: "Build what makes you different; buy what is a commodity. In-house builds of commodity capability burn scarce talent."
