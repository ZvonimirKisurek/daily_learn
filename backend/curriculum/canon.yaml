# The canon: primary sources (papers, textbook chapters, courses) the daily plan assigns alongside the generated chapter.
#
# Why a fixed list? A model asked to "recommend a paper" will sometimes invent one, or the right title with the wrong
# year or authors. Here the model can only POINT AT an id below (closed world, validated like article ids), and every
# title, locator and link is written by a human. Add entries freely; keep `skills` accurate, since the prompt only shows
# entries tagged with the day's skill. `url: null` means "search the title"; never guess a URL.
#
# level: 1 = first exposure, 2 = working knowledge, 3 = research depth.
sources:
