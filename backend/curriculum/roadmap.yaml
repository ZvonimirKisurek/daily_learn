# 24-week MLE roadmap: senior mobile/backend engineer -> ML engineer with depth and public proof of work.
# ~90 min/weekday (25 reading + 60 building) + a 15-minute math drill + spaced review; lighter weekends.
# Two quarters. Each ends with something PUBLIC (a write-up, a reproduction, an open-source PR): skill others can verify.
# Each week's deliverable feeds the next. Activate by setting ROADMAP_START=<the Monday you begin> in .env.
# math_topics: keys of app/mastery/mathdrill.py GENERATORS, drilled daily that week (missed topics resurface automatically).
title: "MLE in 24 weeks: foundations, depth, public proof"
quarters:
  - index: 1
    title: "Foundations that compound"
    weeks: [1, 12]
    public_deliverable: "A public repository plus a technical write-up (blog post or README-as-article) on the retrieval stack you built and measured: rag-lab v2 (week 11) compared against week 1, with the eval set, ablations, plots and an honest limitations section."
    success_criteria:
      - "A stranger can clone the repo and reproduce the headline numbers with one documented command"
      - "Every claim in the write-up is backed by a number from your own eval set"
      - "Posted publicly (blog, GitHub, LinkedIn or a forum) and shared with at least one engineer for feedback"
  - index: 2
    title: "Depth and a reproduction"
    weeks: [13, 24]
    public_deliverable: "A small-scale reproduction of a key result from a paper in the canon (e.g. LoRA vs full fine-tuning, DPR vs BM25, RRF on a BEIR subset), published as a repo + report comparing your numbers with the paper's, plus at least one open-source pull request."
    success_criteria:
      - "The report states the paper's claim, your setup, your numbers, and where and why they differ"
      - "Results include variance across at least 3 seeds"
      - "An open-source pull request is opened (merged is a bonus) on a library you actually used"
beyond:
  - "Months 7-12: pick ONE specialisation and go deep: (a) retrieval and search, (b) LLM training and alignment, or (c) ML infrastructure and inference. Rewrite this roadmap for it with the same rhythm: weekly deliverables, quarterly public artifacts."
  - "Reproduce two more papers, one of them recent (under 12 months old), and publish both."
  - "Contribute to one open-source ML project regularly (a PR a month) instead of one-off fixes."
  - "Write publicly once a month: a result, a failure analysis, or a paper explained with your own experiments."
  - "Practise ML system design out loud: one design per week (a recommender, a RAG product, an eval platform), timed, then compare with published designs."
weeks:
  - index: 1
    title: "Retrieval engineering: RAG on pgvector, measured"
    math_topics: [dot-product, vector-norm, cosine-similarity, precision-recall]
    focus_skills: [rag, vector-db, llm-evals]
    goal: "Build and MEASURE a retrieval pipeline on Postgres/pgvector. Understand embeddings, chunking, ANN indexes, hybrid search and why evaluation comes first."
    deliverable: "A `rag-lab` repo: corpus ingestion, 3 chunkers, pgvector HNSW index, hybrid (BM25 + dense) retrieval with reciprocal rank fusion, and an eval report (recall@k, MRR) on >= 30 labeled queries."
    milestones:
      - "Reproduce cosine similarity in numpy and match pgvector's <=> operator on real vectors"
      - "Compare >= 3 chunking strategies by recall@5, not by intuition"
      - "Measure HNSW ef_search vs recall and latency, and explain the trade-off"
      - "Implement hybrid retrieval (Postgres full-text + dense) fused with RRF"
      - "Hand-label >= 30 query/answer-passage pairs and report recall@k and MRR"
      - "One-page write-up: which change moved recall the most, and why"
    daily_outline:
      - {day: 1, skill: vector-db, focus: "Embeddings and cosine similarity from scratch in numpy; verify against pgvector"}
      - {day: 2, skill: rag, focus: "Chunking: fixed-size, recursive and sentence-based chunkers over a real corpus"}
      - {day: 3, skill: vector-db, focus: "pgvector indexes: HNSW vs IVFFlat, ef_search vs recall and latency"}
      - {day: 4, skill: rag, focus: "Hybrid retrieval: Postgres full-text search + dense, fused with RRF"}
      - {day: 5, skill: llm-evals, focus: "Eval harness: 30 labeled queries, recall@k, MRR, nDCG"}
      - {day: 6, skill: rag, focus: "Reranking experiment (cross-encoder or LLM rerank): measure gain vs cost"}
      - {day: 7, skill: llm-evals, focus: "Write-up, plots and README; decide what to improve next"}

  - index: 2
    title: "Training from first principles: PyTorch and classical ML"
    math_topics: [derivative, chain-rule, gradient-descent, regression-slope, mse]
    focus_skills: [pytorch, classical-ml]
    goal: "Understand how models learn: gradients, loss, optimisation, over/under-fitting, evaluation. Finish by training a real model on YOUR data."
    deliverable: "A relevance classifier trained on the labels you created with `python -m app.cli calibrate` (embeddings as features), compared against the plain cosine-threshold baseline using precision/recall and PR-AUC."
    milestones:
      - "Linear and logistic regression with hand-derived gradients in numpy"
      - "Same models in PyTorch; confirm autograd matches your manual gradients"
      - "A complete training loop: DataLoader, train/val split, early stopping, checkpointing"
      - "Show over-fitting on purpose, then fix it with regularisation and cross-validation"
      - "Beat or lose to gradient boosting (sklearn) with a small MLP, and explain why"
      - "Train the article-relevance classifier and compare to the threshold baseline"
    daily_outline:
      - {day: 1, skill: classical-ml, focus: "Linear regression: normal equation vs gradient descent in numpy; loss surfaces"}
      - {day: 2, skill: pytorch, focus: "Tensors and autograd; logistic regression in PyTorch matching numpy"}
      - {day: 3, skill: pytorch, focus: "A full training loop: DataLoader, validation, early stopping, checkpoints"}
      - {day: 4, skill: classical-ml, focus: "Bias-variance, regularisation, cross-validation; sklearn baselines"}
      - {day: 5, skill: classical-ml, focus: "Gradient boosting vs a small MLP on tabular data; precision/recall/PR-AUC"}
      - {day: 6, skill: pytorch, focus: "Build the article-relevance classifier on your own calibration labels"}
      - {day: 7, skill: classical-ml, focus: "Compare against the threshold baseline; write up what the model learned"}

  - index: 3
    title: "From notebook to production: MLOps and model deployment"
    math_topics: [expectation, variance, conditional-probability, matmul-cost]
    focus_skills: [mlops, llm-evals]
    goal: "Take last week's model from a notebook to a tracked, tested, containerised, monitored service. This is where your backend background is an advantage."
    deliverable: "The relevance model served by a FastAPI endpoint from an ONNX file, with MLflow run tracking, a parity test, a load-test report (p50/p95), a CI job, and a drift monitor on the feed's similarity distribution."
    milestones:
      - "Track Week 2 experiments (params, metrics, artifacts) in MLflow"
      - "Export to ONNX and prove numerical parity with the PyTorch model in a test"
      - "Serve it behind FastAPI with input validation; load-test and report p50/p95 latency"
      - "Containerise and add CI that runs model tests against golden outputs"
      - "Monitor drift: compare today's similarity distribution to a reference (PSI or KS test) and define an alert"
      - "Decision doc: batch vs online inference, canary rollout, rollback"
    daily_outline:
      - {day: 1, skill: mlops, focus: "Experiment tracking with MLflow for the Week 2 runs"}
      - {day: 2, skill: mlops, focus: "Export to ONNX; numerical parity test against PyTorch"}
      - {day: 3, skill: mlops, focus: "Serve the model with FastAPI; validation, batching, load test (p50/p95)"}
      - {day: 4, skill: mlops, focus: "Dockerise and add CI with golden-output model tests"}
      - {day: 5, skill: llm-evals, focus: "Monitoring: drift detection on similarity/relevance distributions with an alert rule"}
      - {day: 6, skill: mlops, focus: "Quantisation (int8): accuracy vs latency vs size trade-off"}
      - {day: 7, skill: mlops, focus: "Decision doc: how you would deploy this at scale (batch/online, canary, rollback)"}

  - index: 4
    title: "Inside the LLM: transformers and fine-tuning"
    math_topics: [softmax, attention-score, cross-entropy, lora-params, parameter-count]
    focus_skills: [llm-finetuning, pytorch, llm-evals]
    goal: "Understand what an LLM is made of by building a small one, then adapt a small open model with LoRA and decide, with evidence, when fine-tuning beats prompting."
    deliverable: "(1) A ~100-line GPT trained on tiny text with a loss curve. (2) A LoRA fine-tune of a small open model on a narrow task from your own data. (3) An eval comparing it with a prompted baseline (quality, cost, latency) and a decision memo."
    milestones:
      - "Implement BPE tokenisation basics and explain what the model actually sees"
      - "Write scaled dot-product and multi-head attention from scratch; check shapes and causal masking"
      - "Assemble a transformer block and train a mini-GPT; read the loss curve"
      - "Run a LoRA fine-tune (PEFT/TRL) of a small open model on Colab for a narrow task"
      - "Evaluate on held-out data against a prompted baseline using Week 1's eval discipline"
      - "Decision memo: when would you fine-tune, prompt, or retrieve?"
    daily_outline:
      - {day: 1, skill: llm-finetuning, focus: "Tokenisation and BPE by hand; embeddings and positional encodings"}
      - {day: 2, skill: pytorch, focus: "Self-attention and multi-head attention from scratch, with causal masking"}
      - {day: 3, skill: pytorch, focus: "Assemble a transformer block and train a mini-GPT on tiny text"}
      - {day: 4, skill: llm-finetuning, focus: "LoRA concepts; prepare the dataset and chat template; set up a PEFT run on Colab"}
      - {day: 5, skill: llm-finetuning, focus: "Run the fine-tune; track loss; check for train/test leakage"}
      - {day: 6, skill: llm-evals, focus: "Evaluate fine-tuned vs prompted baseline on held-out data (quality, cost, latency)"}
      - {day: 7, skill: llm-finetuning, focus: "Decision memo and a retrospective: what to study next quarter"}

  - index: 5
    title: "The math under the hood: linear algebra, probability, likelihood"
    math_topics: [eigenvalues, determinant, matmul-entry, bayes-rule, entropy, kl-divergence]
    focus_skills: [math-foundations, classical-ml]
    goal: "Turn the formulas you have been using into things you can derive. Consolidate the math behind weeks 1-4 so later weeks do not rest on memorised recipes."
    deliverable: "A `math-lab` notebook/repo: PCA derived and implemented from the eigen-decomposition (matching sklearn), logistic regression derived from maximum likelihood with a numerical gradient check, and cross-entropy/KL explained with your own plots."
    milestones:
      - "Implement PCA with numpy's eigen-decomposition of the covariance matrix; match sklearn up to sign"
      - "Derive the logistic-regression gradient from the log-likelihood; verify it with finite differences"
      - "Show numerically that minimising cross-entropy equals maximising likelihood"
      - "Compute entropy and KL divergence for real distributions from your feed data (e.g. category mix per week)"
      - "Write a one-page 'math I now own' note with one derivation in your own words"
    daily_outline:
      - {day: 1, skill: math-foundations, focus: "Vectors, matrices and linear maps; matrix multiplication as composition; shapes as types"}
      - {day: 2, skill: math-foundations, focus: "Eigenvectors and eigenvalues; covariance matrices; PCA from scratch in numpy"}
      - {day: 3, skill: math-foundations, focus: "Probability refresher: Bayes' rule, expectation, variance; simulate to check every formula"}
      - {day: 4, skill: classical-ml, focus: "Maximum likelihood: derive logistic regression's loss and gradient; gradient check"}
      - {day: 5, skill: math-foundations, focus: "Information theory: entropy, cross-entropy, KL divergence, and why they are the losses we use"}
      - {day: 6, skill: math-foundations, focus: "Matrix calculus essentials: gradients of linear layers and softmax, by hand then by autograd"}
      - {day: 7, skill: math-foundations, focus: "Write-up: the derivations you can now do without notes"}

  - index: 6
    title: "Training dynamics: initialisation, normalisation, optimisers, schedules"
    math_topics: [sigmoid, gradient-descent, variance, partial-derivative]
    focus_skills: [pytorch, math-foundations]
    goal: "Understand why deep networks train or fail to train, and run controlled experiments instead of guessing hyper-parameters."
    deliverable: "A `train-dynamics` repo with ablations on a small MLP/CNN (MNIST-sized synthetic or torchvision data): init scale, BatchNorm vs LayerNorm vs none, SGD vs momentum vs AdamW, LR warmup + cosine decay; plots of loss, gradient norms and activation statistics, and a findings table."
    milestones:
      - "Show vanishing/exploding activations with bad init; fix with He/Xavier init and explain the variance argument"
      - "Compare SGD, momentum and AdamW at matched tuning effort; report the best LR for each"
      - "Add normalisation layers and measure their effect on stable learning rates"
      - "Implement LR warmup and cosine decay; show when warmup matters"
      - "Overfit a single batch on purpose as a debugging step (Karpathy's recipe)"
      - "Findings table: each change, its effect, and your explanation"
    daily_outline:
      - {day: 1, skill: pytorch, focus: "Forward and backward signal propagation; initialisation schemes and why scale matters"}
      - {day: 2, skill: pytorch, focus: "Instrumenting training: hooks for activation and gradient statistics; overfit one batch"}
      - {day: 3, skill: pytorch, focus: "Optimisers from scratch: SGD, momentum, Adam/AdamW; compare against torch.optim"}
      - {day: 4, skill: pytorch, focus: "BatchNorm and LayerNorm: implement, compare, and the train/eval mode trap"}
      - {day: 5, skill: pytorch, focus: "Learning-rate schedules: warmup, cosine decay, LR range test"}
      - {day: 6, skill: math-foundations, focus: "Loss landscapes and conditioning: why momentum helps on ill-conditioned quadratics"}
      - {day: 7, skill: pytorch, focus: "Findings write-up and plots; what you would try first on a new model"}

  - index: 7
    title: "Build and train a GPT end to end"
    math_topics: [softmax, attention-score, cross-entropy, parameter-count, matmul-cost]
    focus_skills: [pytorch, llm-finetuning]
    goal: "Own the full stack of a language model: tokenizer, model, training loop, sampling. Extend week 4's mini-GPT into a small but complete system."
    deliverable: "A `tiny-gpt` repo: BPE tokenizer trained on your corpus (e.g. the feed's article text), a decoder-only transformer with KV-cache sampling, a training run with validation loss, and sampling with temperature/top-k/top-p, plus a parameter and FLOP count."
    milestones:
      - "Train a byte-level BPE tokenizer and measure compression (bytes per token) on held-out text"
      - "Implement multi-head causal self-attention and a pre-norm transformer block; unit-test shapes and masking"
      - "Train with AdamW, warmup and gradient clipping; track train/validation loss"
      - "Implement a KV cache and show the generation speed-up"
      - "Implement temperature, top-k and top-p sampling; show their effect on samples"
      - "Count parameters and approximate training FLOPs (6ND) for your run"
    daily_outline:
      - {day: 1, skill: llm-finetuning, focus: "Byte-pair encoding: train a tokenizer on your corpus; compression and edge cases"}
      - {day: 2, skill: pytorch, focus: "The decoder-only transformer: embeddings, causal attention, MLP, residuals, pre-norm"}
      - {day: 3, skill: pytorch, focus: "The training loop at scale-in-miniature: batching, AdamW, warmup, clipping, checkpoints"}
      - {day: 4, skill: pytorch, focus: "Sampling: greedy, temperature, top-k, top-p; perplexity on held-out text"}
      - {day: 5, skill: pytorch, focus: "KV cache: implement it and measure the generation speed-up"}
      - {day: 6, skill: llm-finetuning, focus: "Scaling intuition: parameter counts, FLOPs (6ND), and what scaling laws predict"}
      - {day: 7, skill: llm-finetuning, focus: "README with loss curves and samples; what limits your model's quality"}

  - index: 8
    title: "Evaluating LLM systems rigorously"
    math_topics: [precision-recall, conditional-probability, variance, expectation]
    focus_skills: [llm-evals]
    goal: "Measure LLM output quality with the same rigour as a unit test suite: datasets, judges, agreement, uncertainty."
    deliverable: "An `eval-lab` harness that scores MLE-Sprint's own generated chapters (or another LLM feature you built): a labelled set of >= 40 items, an LLM-as-judge with a written rubric, judge-human agreement (Cohen's kappa), bootstrap confidence intervals, and a regression report comparing two prompt versions."
    milestones:
      - "Write an eval spec: what 'good' means, failure categories, and how each is measured"
      - "Hand-label >= 40 outputs against the spec"
      - "Build an LLM judge and measure agreement with your labels (accuracy and Cohen's kappa)"
      - "Report every metric with a bootstrap 95% confidence interval"
      - "Compare two prompt versions and decide whether the difference is real"
      - "Document the judge's biases you observed (position, length, self-preference)"
    daily_outline:
      - {day: 1, skill: llm-evals, focus: "Eval design: defining quality, failure taxonomies, and choosing metrics"}
      - {day: 2, skill: llm-evals, focus: "Building a labelled eval set: sampling, labelling guidelines, inter-annotator thinking"}
      - {day: 3, skill: llm-evals, focus: "LLM-as-judge: rubric prompts, structured verdicts, and known biases"}
      - {day: 4, skill: llm-evals, focus: "Agreement statistics: accuracy, Cohen's kappa, confusion matrices"}
      - {day: 5, skill: llm-evals, focus: "Uncertainty: bootstrap confidence intervals and paired comparisons"}
      - {day: 6, skill: llm-evals, focus: "Regression testing prompts: run two versions, compare, decide"}
      - {day: 7, skill: llm-evals, focus: "Eval report: what you can and cannot claim from your numbers"}

  - index: 9
    title: "Efficient inference: latency, memory and cost"
    math_topics: [matmul-cost, parameter-count, lora-params, expectation]
    focus_skills: [mlops, pytorch]
    goal: "Know where inference time and memory go, and how quantisation, batching and caching change them. Measure everything on CPU."
    deliverable: "An `inference-lab` benchmark of a small open model (or your week 7 GPT) on CPU: latency and throughput vs batch size, int8 dynamic quantisation (accuracy/perplexity vs speed vs size), KV-cache memory accounting, and a cost model for serving 1M requests."
    milestones:
      - "Profile a forward pass and attribute time to layers (torch.profiler)"
      - "Measure latency (p50/p95) and throughput across batch sizes; explain the curve"
      - "Apply int8 dynamic quantisation; report perplexity, latency and size before and after"
      - "Compute KV-cache memory for a given context length and batch, and verify it empirically"
      - "Explain speculative decoding and continuous batching in your own words, with a toy simulation"
      - "Cost model: requests/day x tokens x latency -> machines and dollars"
    daily_outline:
      - {day: 1, skill: mlops, focus: "Where inference time goes: memory bandwidth vs compute, profiling a forward pass"}
      - {day: 2, skill: mlops, focus: "Batching: throughput vs latency; measure p50/p95 across batch sizes"}
      - {day: 3, skill: pytorch, focus: "Quantisation: affine int8, scale and zero-point; dynamic quantisation in PyTorch"}
      - {day: 4, skill: mlops, focus: "The KV cache and its memory cost; why long contexts are expensive"}
      - {day: 5, skill: mlops, focus: "Serving systems: continuous batching, PagedAttention, speculative decoding (simulate)"}
      - {day: 6, skill: mlops, focus: "Cost modelling: from tokens and latency to machines and dollars"}
      - {day: 7, skill: mlops, focus: "Benchmark report with plots and recommendations"}

  - index: 10
    title: "Agents and tool use, measured"
    math_topics: [bayes-rule, entropy, conditional-probability, precision-recall]
    focus_skills: [rag, llm-evals]
    goal: "Build an LLM agent that calls tools, and evaluate it by task success rather than by impressions."
    deliverable: "A small agent over a read-only tool set (e.g. search the feed, look up a skill, query a calculator) with a ReAct-style loop, structured tool calls, error handling, and an evaluation on >= 20 scripted tasks reporting success rate, steps and cost."
    milestones:
      - "Implement a tool-calling loop with typed tool schemas and validated arguments"
      - "Handle tool errors, retries and a step budget"
      - "Write >= 20 tasks with checkable success criteria"
      - "Report success rate, average steps and tokens per task, with failure analysis"
      - "Compare the agent with a single-shot RAG baseline on the same tasks"
    daily_outline:
      - {day: 1, skill: rag, focus: "Tool use: function-calling APIs, tool schemas, and argument validation"}
      - {day: 2, skill: rag, focus: "The ReAct loop: reasoning, acting, observing; step budgets and stopping"}
      - {day: 3, skill: rag, focus: "Robustness: tool errors, retries, and guarding against prompt injection in tool output"}
      - {day: 4, skill: llm-evals, focus: "Agent evaluation: task suites with programmatic success checks"}
      - {day: 5, skill: llm-evals, focus: "Failure analysis: categorise failures and fix the top one"}
      - {day: 6, skill: rag, focus: "Agent vs single-shot RAG: when is the loop worth its cost?"}
      - {day: 7, skill: llm-evals, focus: "Write-up: success rate, cost, and the failure taxonomy"}

  - index: 11
    title: "Advanced retrieval: rerankers, query rewriting, tuned embeddings"
    math_topics: [cosine-similarity, softmax, cross-entropy, precision-recall]
    focus_skills: [rag, vector-db]
    goal: "Push week 1's rag-lab measurably further with the techniques production search teams use, keeping the same eval set so the gains are real."
    deliverable: "rag-lab v2: a cross-encoder reranker, query rewriting (HyDE or multi-query), an embedding model fine-tuned with a contrastive loss on your labelled pairs, and an ablation table vs week 1 (recall@k, MRR, nDCG, latency)."
    milestones:
      - "Add a cross-encoder reranker and measure quality vs latency"
      - "Implement HyDE or multi-query rewriting and measure its effect"
      - "Fine-tune a small embedding model with in-batch negatives (InfoNCE) on your labelled pairs"
      - "Re-run the week 1 eval set; produce an ablation table with confidence intervals"
      - "Write down which change helped most and why"
    daily_outline:
      - {day: 1, skill: rag, focus: "Bi-encoders vs cross-encoders vs late interaction; where each sits on the cost/quality curve"}
      - {day: 2, skill: rag, focus: "Reranking: add a cross-encoder stage and measure"}
      - {day: 3, skill: rag, focus: "Query rewriting: HyDE and multi-query; when they help and when they hurt"}
      - {day: 4, skill: vector-db, focus: "Contrastive learning: InfoNCE with in-batch negatives, from scratch on toy data"}
      - {day: 5, skill: vector-db, focus: "Fine-tune a small embedding model on your pairs; re-index and evaluate"}
      - {day: 6, skill: rag, focus: "Ablations with confidence intervals against week 1"}
      - {day: 7, skill: rag, focus: "Results write-up: the material for the Q1 public post"}

  - index: 12
    title: "Q1 capstone: publish your retrieval work"
    math_topics: [cosine-similarity, gradient-descent, cross-entropy, bayes-rule, variance]
    focus_skills: [llm-evals, mlops, rag]
    goal: "Turn twelve weeks of private work into public, reproducible evidence of skill. Writing it up is where you find the gaps in your understanding."
    deliverable: "The Q1 public deliverable: a public repo that reproduces your rag-lab results with one command, and a published technical write-up with your numbers, plots and limitations."
    milestones:
      - "Fresh-clone reproducibility: one command rebuilds the eval numbers"
      - "Figures: the 3-4 plots that tell the story, each with a one-sentence takeaway"
      - "Draft the write-up: problem, setup, results, what surprised you, limitations"
      - "Get feedback from one engineer (or a careful self-review against a checklist) and revise"
      - "Publish and share; record the link in the weekly retrospective"
      - "Q1 retrospective: skill matrix, review retention, math accuracy, and what to change for Q2"
    daily_outline:
      - {day: 1, skill: mlops, focus: "Reproducibility: pin dependencies, seed everything, one-command pipeline"}
      - {day: 2, skill: llm-evals, focus: "Choosing the story: which result matters, and the evidence for it"}
      - {day: 3, skill: llm-evals, focus: "Figures and tables that communicate: one message per plot"}
      - {day: 4, skill: rag, focus: "Write the draft: setup, method, results, limitations"}
      - {day: 5, skill: llm-evals, focus: "Review and revise: check every claim against a number"}
      - {day: 6, skill: mlops, focus: "Publish: README, license, a clean history; share it"}
      - {day: 7, skill: llm-evals, focus: "Quarter retrospective and Q2 plan"}

  - index: 13
    title: "Supervised fine-tuning for real"
    math_topics: [lora-params, cross-entropy, kl-divergence, parameter-count]
    focus_skills: [llm-finetuning, llm-evals]
    goal: "Fine-tune a small open model on a narrow task end to end, with clean data, a proper eval and an honest comparison to prompting."
    deliverable: "An SFT pipeline (Colab-friendly): dataset curation from your own data, chat templates, LoRA training with loss masking on prompts, held-out eval vs a prompted baseline (quality, cost, latency), and a model card."
    milestones:
      - "Curate >= 300 training examples with a documented format and a leak-free split"
      - "Apply the model's chat template and mask the loss on prompt tokens"
      - "Train LoRA adapters; track train/validation loss"
      - "Evaluate against a prompted baseline with week 8's harness"
      - "Write a model card: data, intended use, limitations, eval results"
    daily_outline:
      - {day: 1, skill: llm-finetuning, focus: "When to fine-tune vs prompt vs retrieve; framing the task"}
      - {day: 2, skill: llm-finetuning, focus: "Dataset curation: format, quality filters, deduplication, splits"}
      - {day: 3, skill: llm-finetuning, focus: "Chat templates and loss masking: what the model is actually trained on"}
      - {day: 4, skill: llm-finetuning, focus: "LoRA training run on Colab; reading loss curves"}
      - {day: 5, skill: llm-evals, focus: "Evaluate against the prompted baseline; significance"}
      - {day: 6, skill: llm-finetuning, focus: "Error analysis and one improvement iteration"}
      - {day: 7, skill: llm-finetuning, focus: "Model card and write-up"}

  - index: 14
    title: "Preference optimisation: reward models and DPO"
    math_topics: [kl-divergence, sigmoid, softmax, entropy]
    focus_skills: [llm-finetuning, math-foundations]
    goal: "Understand how models are aligned to preferences: the Bradley-Terry model, reward models, the KL penalty, and DPO's closed form."
    deliverable: "A DPO implementation from scratch on a tiny model (e.g. your week 7 GPT or a small open model) with a preference dataset you build, plus a reward-model baseline; plots of preference accuracy, reward margins and KL to the reference model."
    milestones:
      - "Derive the Bradley-Terry preference probability and train a tiny reward model"
      - "Derive the DPO loss from the KL-regularised objective; implement it in PyTorch"
